{% for item in group.contexto %}<article><h2>{{ item.etiqueta }}</h2><p>{{ item.pais }} · {{ item.periodo }} · {{ item.valor if item.valor is not none else 'Dato no disponible' }} {{ item.unidad }}</p><p>{{ item.limitaciones }}</p><p>{{ item.razon }}</p><a href="/evidence/{{ item.id_evidencia|urlencode }}">Ver evidencia</a></article>{% else %}<p>{{ group.sin_contexto_motivo }}</p>{% endfor %}
