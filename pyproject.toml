[project]
name = "whoami"
version = "0.1.0"
description = "De la señal a la decisión - hackIAthon TVN Media"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "huggingface-hub>=1.0",
    "jinja2>=3.1,<4",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "openai>=3.26.0",
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.9.1",
    "tokenizers>=0.23.2",
    "tzdata>=2025.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
whoami = "whoami.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.0,<3",
    "playwright>=1.55,<2",
    "pytest>=8.0",
]
experiments = [
    "fastembed>=0.8.1",
    "model2vec>=0.9.0",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoami"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real browser editor flows (requires Playwright Chromium or system Chrome)"]
