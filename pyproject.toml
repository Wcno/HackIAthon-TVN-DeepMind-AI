[project]
name = "whoami"
version = "0.1.0"
description = "De la señal a la decisión - hackIAthon TVN Media"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.20",
    "openai>=3.26.0",
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "tokenizers>=0.21",
]

[project.scripts]
whoami = "whoami.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]
experiments = [
    "fastembed>=0.8.1",
    "model2vec>=0.9.0",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoami"]

[tool.pytest.ini_options]
testpaths = ["tests"]
