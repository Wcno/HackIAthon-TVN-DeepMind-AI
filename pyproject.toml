[project]
name = "whoami"
version = "0.1.0"
description = "De la señal a la decisión - hackIAthon TVN Media"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.scripts]
whoami = "whoami.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoami"]

[tool.pytest.ini_options]
testpaths = ["tests"]
