[project]
name = "whoami"
version = "0.1.0"
description = "De la señal a la decisión - hackIAthon TVN Media"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "openai>=1.0,<3",
    "python-multipart>=0.0.20,<1",
    "tzdata>=2025.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
whoami = "whoami.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoami"]

[tool.pytest.ini_options]
testpaths = ["tests"]
